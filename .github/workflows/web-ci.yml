name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    # Dummy values so `next build` succeeds without real secrets.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
      JWT_SECRET: "dummy-jwt-secret-for-ci-at-least-32-chars"
      CRON_SECRET: "dummy-cron-secret-for-ci"
      NEXT_PUBLIC_CONTRACT_NETWORK: "testnet"
      NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
      STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before npm ci / build so a tampered config never executes.
      - name: Check build configs for hidden code
        working-directory: .
        run: .github/scripts/check-build-configs.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build runs before tsc because web/next-env.d.ts is gitignored and is
      # generated by Next; tsc on a clean checkout can miss its types.
      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test --if-present
